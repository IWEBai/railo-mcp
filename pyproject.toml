[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "railo-mcp"
version = "0.1.0"
description = "Railo Model Context Protocol (MCP) Server — Mathematical Safety Guardrail for AI Code Generation"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Railo Security", email = "contact@railo.dev" }]
keywords = ["mcp", "security", "cursor", "claude", "formal-verification", "ast", "cwe"]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://railo.dev"
Repository = "https://github.com/IWEBai/railo-mcp"
Issues = "https://github.com/IWEBai/railo-mcp/issues"

[project.scripts]
railo-mcp = "railo_mcp.server:main"
